<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Chơi với Bot</title>
<!--
  A stand-in for Chess.com's newer bot pages, built from a real diagnostic
  report: div.board holds nothing but coordinate labels and one empty layer,
  there is no square-XX class anywhere, and the move list's class names are
  hashed. The only readable thing on the page is the text of the moves.
-->
<style>
 body{margin:0;background:#312e2b;font-family:system-ui;color:#eee}
 .layout{display:flex;gap:20px;padding:20px}
 /* A square layout column larger than the board, as the real page has: the
    overlay must anchor to the board inside it, not to this. */
 .board-layout-main{position:relative;width:620px;height:620px;padding:70px}
 #board-layout-chessboard{position:relative;width:480px;height:480px}
 .board{position:relative;width:480px;height:480px;background:#769656}
 .coordinates{position:absolute;inset:0;width:100%;height:100%}
 .gjQxHO{width:280px;font-size:14px;line-height:2}
 .pLmNo{display:flex;flex-wrap:wrap;gap:6px}
 .a7Bq{padding:2px 6px;background:#3d3a35;border-radius:4px}
 .a7Bq.selected{background:#7fa650;color:#16200c}
</style></head><body>
<div class="layout">
  <div class="board-layout-main"><div id="board-layout-chessboard">
    <div class="board">
      <style>.x{}</style>
      <svg class="coordinates" viewBox="0 0 100 100">
        <text class="coordinate-light" x="0.75" y="3.5" font-size="2.8">8</text>
        <text class="coordinate-dark" x="0.75" y="15.75" font-size="2.8">7</text>
        <text class="coordinate-light" x="0.75" y="91" font-size="2.8">1</text>
        <text class="coordinate-light" x="0.75" y="28" font-size="2.8">6</text>
        <text class="coordinate-dark" x="10" y="99" font-size="2.8">a</text>
        <text class="coordinate-light" x="22" y="99" font-size="2.8">b</text>
        <text class="coordinate-dark" x="35" y="99" font-size="2.8">c</text>
        <text class="coordinate-light" x="97" y="99" font-size="2.8">h</text>
      </svg>
      <div style="width:100%;height:100%;position:absolute"></div>
    </div>
  </div></div>
  <div class="side">
    <div class="gjQxHO"><div class="pLmNo" id="moves"></div></div>
    <div class="live-game-buttons-component" id="live-controls">
      <button data-cy="resign-button">Đầu hàng</button>
    </div>
    <div id="result-area"></div>
    <div class="chat-area">Đối thủ nói: nước Nf3 hay đấy</div>
  </div>
  <div class="board-layout-sidebar">
    Giuoco Piano Game: Center Attack, Mason Gambit — 1. e4 e5 2. Nf3 Nc6
    3. Bc4 Bc5 4. c3 Nf6 5. d4 exd4 6. O-O dxc3 7. e5 Ng4 8. Bxf7+ Kxf7
  </div>
</div>
<script>
// Piece letters are drawn as images, as Chess.com does: the text of "Nf3"
// reads only "f3", and "Nxd4" reads only "xd4".
window.setMoves = function (moves) {
  var list = document.getElementById('moves');
  list.textContent = '';
  moves.forEach(function (move, i) {
    var el = document.createElement('span');
    el.className = 'a7Bq' + (i === moves.length - 1 ? ' selected' : '');
    if (move.piece) {
      var img = document.createElement('img');
      img.src = 'data:image/gif;base64,R0lGODlhAQABAAAAACw=';
      img.alt = '';
      img.width = 12;
      el.appendChild(img);
    }
    el.appendChild(document.createTextNode(move.text));
    list.appendChild(el);
  });
};
// 1.e4 c5 2.Nf3 d6 3.d4 cxd4 4.Nxd4 Nc6 5.Nxc6 bxc6 — an Open Sicilian, with
// every piece letter missing. "xd4" could be Nxd4 or Qxd4; only after Nxd4 is
// the later capture on c6 possible, so the reader has to work it out.
setMoves([
  { text: 'e4' }, { text: 'c5' },
  { text: 'f3', piece: 1 }, { text: 'd6' },
  { text: 'd4' }, { text: 'cxd4' },
  { text: 'xd4', piece: 1 }, { text: 'c6', piece: 1 },
  { text: 'xc6', piece: 1 }, { text: 'bxc6' }
]);

// Ends the game the way the page does: the live controls go, a result appears.
window.endGame = function () {
  document.getElementById('live-controls').remove();
  var over = document.createElement('div');
  over.className = 'game-over-modal-content';
  over.textContent = 'Trắng thắng';
  document.getElementById('result-area').appendChild(over);
};
</script></body></html>
