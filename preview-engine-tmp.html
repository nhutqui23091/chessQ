<style>
  body { margin:0; background:#312e2b; font-family:system-ui; height:720px; }
  .wrap { display:flex; gap:24px; padding:28px; }
  .board { position:relative; width:480px; height:480px; display:grid;
           grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr);
           border-radius:4px; overflow:hidden; }
  .sq { display:flex; align-items:center; justify-content:center; font-size:42px; line-height:1; }
